<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Evin McReynolds Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(to right, #f5f5f5, #e0e0e0);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-top: 40px;
    }

    h1 {
      color: #00bfff;
      font-size: 2.3em;
      margin-bottom: 10px;
    }

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #00bfff;
    }

    /* Computer image container */
    .computer {
      position: relative;
      margin-top: 60px;
      width: 950px;
      max-width: 95%;
    }

    .computer img {
      width: 100%;
      display: block;
    }

    /* Folder icons positioned inside the screen area */
    .project {
      position: absolute;
      width: 50px;
      height: 50px;
      text-align: center;
      font-size: 12px;
      color: #000;
      font-weight: 500;
      text-shadow: 1px 1px 2px #fff;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .project img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }

    .project span {
      display: block;
      margin-top: 3px;
    }

    .project:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 6px #00bfff);
    }

    /* --- Positioning of projects on the screen --- */
    .p1 { top: 20%; left: 33%; }
    .p2 { top: 20%; left: 43%; }
    .p3 { top: 20%; left: 53%; }
    .p4 { top: 20%; left: 63%; }
    .p5 { top: 35%; left: 33%; }
    .p6 { top: 35%; left: 43%; }
    .p7 { top: 35%; left: 53%; }
    .p8 { top: 35%; left: 63%; }
    .p9 { top: 50%; left: 38%; }
    .p10 { top: 50%; left: 58%; }

    footer {
      margin-top: 60px;
      padding: 20px;
      font-size: 0.9em;
      color: #777;
      text-align: center;
    }

    @media (max-width: 768px) {
      .computer { width: 100%; }
      .project { width: 35px; height: 35px; font-size: 10px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Projects by Evin</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="aboutEM.html">About</a></li>
      <li><a href="skillsem.html">Skills</a></li>
      <li><a href="contactem.html">Contact</a></li>
      <li>Projects</li>
    </ul>
  </nav>

  <section class="computer">
    <img src="applelap.png" alt="Computer background">

    <!-- Project icons with labels -->
    <a href="ClonePage\index.html" target="_blank" class="project p1">
      <img src="folderpic.png" alt="Volt">
      <span>Volt</span>
    </a>

    <a href="WOTMvmembership\index.html" target="_blank" class="project p3">
      <img src="folderpic.png" alt="WOTM membership">
      <span>The Barrel Club</span>
    </a>

    <a href="evolvewithjereca.com" target="_blank" class="project p4">
      <img src="folderpic.png" alt="Evolve">
      <span>Evolve</span>
    </a>


    <a href="evinsweatherapp.com" target="_blank" class="project p8">
      <img src="folderpic.png" alt="Weather App">
      <span>Weather</span>
    </a>

    <a href="evinsfoodproject.com" target="_blank" class="project p9">
      <img src="folderpic.png" alt="Food">
      <span>Food</span>
    </a>

  </section>

  <footer>
    &copy; 2025 Evin McReynolds | Designed & Built by Me
  </footer>
</body>
</html>
