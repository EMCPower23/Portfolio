<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About | Evin McReynolds Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(to right, #f0f0f0, #dcdcdc);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-top: 60px;
    }

    h1 {
      color: #00bfff;
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    #itg {
      height: 150px;
      width: 150px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #itg:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.5);
    }

    #text {
      margin: 30px auto;
      width: 80%;
      max-width: 600px;
      background: #fff;
      color: #333;
      border-radius: 10px;
      border: none;
      padding: 20px;
      font-size: 1em;
      font-family: inherit;
      line-height: 1.6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .resume-container {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    embed {
      width: 90%;
      max-width: 600px;
      height: 400px;
      border: 2px solid #00bfff;
      border-radius: 10px;
    }

    nav {
      margin-top: 60px;
    }

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 30px;
      justify-content: center;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #00bfff;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 0.9em;
      color: #777;
      text-align: center;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2em; }
      #itg { height: 120px; width: 120px; }
      embed { height: 300px; }
      #text { font-size: 0.9em; padding: 15px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>About Me</h1>
    <img src="ITguy.jpeg" id="itg" onclick="toggleInfo()" title="Click me for more info" alt="Photo of Evin McReynolds" />
  </header>

  <section class="resume-container">
    <embed src="Evin's Resume.pdf" type="application/pdf" />
    <p><a href="evin's resume.pdf" target="_blank" style="color:#00bfff; text-decoration:none; font-weight:600;">Download My Resume</a></p>
  </section>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="aboutEM.html">About</a></li>
      <li><a href="skillsem.html">Skills</a></li>
      <li><a href="EvinPro.html">Projects</a></li>
      <li><a href="contactem.html">Contact</a></li>
    </ul>
  </nav>

  <footer>
    &copy; 2025 Evin McReynolds | Designed & Built by Me
  </footer>

  <script>
    function toggleInfo() {
      const existing = document.getElementById("text");
      if (existing) {
        existing.remove();
        return;
      }

      const textArea = document.createElement("div");
      textArea.id = "text";
      textArea.textContent = `
My journey in web development began in 2015, driven by a mix of curiosity and creativity. Today, I am a graduate with my Associate’s degree in web design/development, supported by years of self-taught learning and hands-on freelance experience. I’m passionate about building experiences that not only look great but feel effortless to use.`;
      const header = document.querySelector("header");
      header.appendChild(textArea);
    }
  </script>
</body>
</html>
