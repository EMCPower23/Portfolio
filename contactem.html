<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Evin | Portfolio</title>

  <style>
    /* General page style */
    body {
      margin: 0;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(to right, #f5f5f5, #e0e0e0);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-top: 40px;
    }

    h1 {
      font-size: 2.3em;
      color: #00bfff;
      margin-bottom: 10px;
    }

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #00bfff;
    }

    /* Contact section */
    .contact-section {
      margin-top: 60px;
      text-align: center;
    }

    .contact-icons {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .contact-icons a {
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .contact-icons img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .contact-icons a:hover {
      transform: scale(1.15);
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.7);
    }

    /* Optional: background colors for each icon */
    .contact-icons a:nth-child(1) {
      background: #db4437;
    }

    .contact-icons a:nth-child(2) {
      background: #0077b5;
    }

    .contact-icons a:nth-child(3) {
      background: #34a853;
    }

    /* Contact info below icons */
    .contact-info {
      margin-top: 20px;
      font-size: 1.1em;
      color: #555;
      line-height: 1.8;
    }

    .contact-info a {
      color: #00bfff;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 0.9em;
      color: #777;
      text-align: center;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      .contact-icons a {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>

      <p>Email: <a href="mailto:emcreynolds4@gmail.com">emcreynolds4@gmail.com</a></p>

    </div>
  </section>

  <footer>
    &copy; 2025 Evin McReynolds | Designed & Built by Me
